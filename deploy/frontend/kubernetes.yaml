apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-frontend
  template:
    metadata:
      labels:
        app: event-frontend
    spec:
      containers:
        - name: frontend
          image: registry.k8s.gu.se/appademin/event-frontend:0.0.1-test
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: web
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: web
          livenessProbe:
            httpGet:
              path: /
              port: web
---
apiVersion: v1
kind: Service
metadata:
  name: event-frontend-service
spec:
  selector:
    app: event-frontend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: web
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: event-frontend
  annotations:
    kubernetes.io/tls-acme: 'true'
    haproxy.router.openshift.io/set-forwarded-headers: replace
    haproxy.router.openshift.io/timeout: 1h
spec:
  host: event-analysis.test.appadem.in
  to:
    kind: Service
    name: event-frontend-service
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: event-egress
spec:
  type: egress
  replicas: 2
---
apiVersion: v1
kind: Service
metadata:
  name: spark-backend
  annotations:
    tailscale.com/tailnet-fqdn: clic-spark.tail796302.ts.net
    tailscale.com/proxy-group: event-egress
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP

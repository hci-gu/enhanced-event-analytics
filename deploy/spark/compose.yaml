services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/spark/Dockerfile
      target: backend
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_ID: ${MODEL_ID:?Set MODEL_ID in the environment file}
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      SERVING_ENGINE: ${SERVING_ENGINE:-transformers}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set AUTH_ALLOWED_ORIGINS to the public HTTPS origin}
      AUTH_COOKIE_SECURE: "true"
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /data/huggingface
      LANCEDB_STORAGE_PATH: /data/vectordb
      POCKETBASE_URL: http://127.0.0.1:8090
    volumes:
      - model-cache:/data/huggingface
      - lancedb-data:/data/vectordb
  pocketbase:
    build:
      context: ../..
      dockerfile: deploy/spark/Dockerfile
      target: pocketbase
    network_mode: service:backend
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - pocketbase-data:/data/pb_data

volumes:
  model-cache:
  lancedb-data:
  pocketbase-data:

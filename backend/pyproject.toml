[project]
name = "enhanced-event-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.133.0,<0.137.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0",
    "transformers>=5.19.0,<6",
    "pillow>=10",
    "httpx>=0.28",
]

[project.optional-dependencies]
cpu = ["torch>=2.6", "torchvision>=0.21"]
cuda = [
    "torch==2.13.0; sys_platform == 'linux'",
    "torchvision==0.28.0; sys_platform == 'linux'",
    "accelerate>=1.1; sys_platform == 'linux'",
    "vllm==0.29.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
